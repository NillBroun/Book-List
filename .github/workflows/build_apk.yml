name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Project Files
        run: flutter create . --platforms=android --org=com.ahm.booklist

      - name: Configure Android Settings (App Name & SDK Version)
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Book List"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Optimized APK (ARM64)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=./debug-info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-List-APK
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
