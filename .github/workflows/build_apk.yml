name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: 5. Configure Gradle 9.3.1, SDK 36 and Permissions
        run: |
          cd ../booknotes_fresh

          # ১. রিকোয়ারমেন্ট অনুযায়ী Gradle 9.3.1 সেট করা
          sed -i 's/gradle-.*-all.zip/gradle-9.3.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties

          # ২. compileSdk 36, minSdk 21 ও targetSdk 34 সেট করা
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts

          # ৩. রিলিজ বিল্ডকে ডিবাগ সাইনিং দেওয়া এবং AarMetadata চেকার বন্ধ করা
          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
          with open(p, 'w') as f:
              f.write(c)
          with open(p, 'a') as f:
              f.write('\nandroidComponents {\n    onVariants {\n        it.androidTest?.let { }\n    }\n}\ngradle.projectsEvaluated {\n    tasks.matching { it.name.contains(\"AarMetadata\") }.configureEach {\n        enabled = false\n    }\n}\n')
          "

          # ৪. অতিরিক্ত সেফটি প্রোপার্টি
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          # ৫. অ্যাপের নাম BookNotes এবং অফলাইন স্টোরেজ পারমিশন
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Prepare Packages & Launcher Icons
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

      - name: 7. Compile Universal APK
        run: |
          cd ../booknotes_fresh
          # ইউনিভার্সাল রিলিজ APK কম্পাইল
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons

          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
