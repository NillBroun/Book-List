name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Universal APK with Open Book Icon
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org=com.ahm book_list
          cd book_list
          cp ../../pubspec.yaml .
          cp ../../lib/main.dart ./lib/main.dart
          
          # Custom Open Book (📖) Vector Launcher Icon
          cat << 'EOF' > android/app/src/main/res/drawable/ic_book_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <!-- Dark Background -->
              <path
                  android:fillColor="#181818"
                  android:pathData="M0,0h24v24H0z"/>
              <!-- Open Book Pages (📖 Shape) -->
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M21,5c-1.11,-0.35 -2.33,-0.5 -3.5,-0.5 -1.95,0 -4.05,0.4 -5.5,1.5 -1.45,-1.1 -3.55,-1.5 -5.5,-1.5 -1.17,0 -2.39,0.15 -3.5,0.5C2.42,5.28 2,5.8 2,6.4v12.2c0,0.92 0.88,1.6 1.78,1.38C4.8,19.74 5.9,19.5 7,19.5c1.95,0 4.05,0.4 5.5,1.5 1.45,-1.1 3.55,-1.5 5.5,-1.5 1.1,0 2.2,0.24 3.22,0.48 0.9,0.22 1.78,-0.46 1.78,-1.38V6.4c0,-0.6 -0.42,-1.12 -1,-1.4zM20,18.5c-0.95,-0.25 -2,-0.5 -3,-0.5 -1.68,0 -3.42,0.46 -4.5,1.1V7.5c1.08,-0.64 2.82,-1.1 4.5,-1.1 1,0 2.05,0.25 3,0.5v11.6zM10.5,19.1c-1.08,-0.64 -2.82,-1.1 -4.5,-1.1 -1,0 -2.05,0.25 -3,0.5V6.9c0.95,-0.25 2,-0.5 3,-0.5 1.68,0 3.42,0.46 4.5,1.1v11.6z"/>
          </vector>
          EOF
          
          # Link launcher icon
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_book_icon"/g' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-List-Universal-APK
          path: temp_app/book_list/build/app/outputs/flutter-apk/app-release.apk
