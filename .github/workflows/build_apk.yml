name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ধাপ ৩.১: কোড নামানো
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # ধাপ ৩.২: জাভা ১৭ সেটআপ
      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # ধাপ ৩.৩: ফ্লুটার ইঞ্জিন সেটআপ
      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ধাপ ৩.৪: ফ্রেশ অ্যান্ড্রয়েড প্ল্যাটফর্ম কাঠামো তৈরি
      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      # ধাপ ৩.৫: SDK ভার্সন এবং পারমিশন কনফিগার করা
      - name: 5. Configure SDK Versions and Permissions
        run: |
          cd ../booknotes_fresh
          
          # ফ্লুটারের গ্লোবাল SDK ওভাররাইড প্রোপার্টি যুক্ত করা
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          # স্টোরেজ পারমিশন ও অ্যাপ নাম ঠিক করা
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      # ধাপ ৩.৬: প্যাকেজ লোড ও আইকন প্রস্তুত করা
      - name: 6. Prepare Packages & Launcher Icons
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

      # ধাপ ৩.৭: ইউনিভার্সাল APK কম্পাইল করা
      - name: 7. Compile Universal APK
        run: |
          cd ../booknotes_fresh
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          
          # আউটপুট ফোল্ডারে APK কপি করা
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      # ধাপ ৩.৮: তৈরি হওয়া APK আপলোড করা
      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
