name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Build Universal APK
        run: |
          # ১. ফ্রেশ ফ্লুটার প্রজেক্ট তৈরি
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh

          # ২. আমাদের মূল ফাইলগুলো স্থানান্তর
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

          # ৩. গ্লোবালি minSdk 21 ও compileSdk 34 সেট করা
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          echo "flutter.minSdkVersion=21" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.targetSdkVersion=34" >> android/gradle.properties

          # ৪. রিলিজ বিল্ডের সাইনিং কনফিগ নিশ্চিত করা (debug signing দিয়ে সাইন করা যাতে ইনস্টলেশন ঠিক থাকে)
          python3 -c "
          import os
          target = 'android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else 'android/app/build.gradle'
          with open(target, 'r') as f:
              c = f.read()
          if 'signingConfigs.debug' not in c and 'signingConfigs.getByName(\"debug\")' not in c:
              c = c.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
              with open(target, 'w') as f:
                  f.write(c)
          "

          # ৫. ডিসপ্লে নাম ও স্টোরেজ পারমিশন
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # ৬. ডিপেন্ডেন্সি ও আইকন প্রস্তুত করা
          flutter pub get
          dart run flutter_launcher_icons

          # ৭. ইউনিভার্সাল রিলিজ APK বিল্ড (no-shrink সহ)
          flutter build apk --release --no-shrink --target-platform android-arm,android-arm64,android-x64

          # ৮. আর্টফ্যাক্টের জন্য ফাইল ব্যাক করা
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
