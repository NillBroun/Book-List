name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Build Universal APK
        run: |
          # ১. ফ্রেশ ও সাপোর্টেড অ্যান্ড্রয়েড প্রজেক্ট তৈরি
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh

          # ২. মূল সোর্স কোড ও আইকন কপি করা
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

          # ৩. সরাসরি ফাইলের ভেতর compileSdk 34 এবং minSdk 21 বসানো (Kotlin ও Groovy উভয়ের জন্য)
          find android/ -name "build.gradle*" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find android/ -name "build.gradle*" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} +

          # ৪. ডিসপ্লে নাম BookNotes ও ব্যাকআপ স্টোরেজ পারমিশন যুক্ত করা
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # ৫. ডিপেন্ডেন্সি আনা ও আইকন জেনারেট করা
          flutter pub get
          dart run flutter_launcher_icons

          # ৬. ইউনিভার্সাল রিলিজ APK কম্পাইল করা
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

          # ৭. তৈরি হওয়া APK আর্টফ্যাক্ট ফোল্ডারে স্থানান্তর
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
