name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Optimized APK with Book Icon
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org=com.ahm book_list
          cd book_list
          cp ../../pubspec.yaml .
          cp ../../lib/main.dart ./lib/main.dart
          
          # Add custom Book vector icon for Android Launcher
          cat << 'EOF' > android/app/src/main/res/drawable/ic_book_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#121212"
                  android:pathData="M0,0h24v24H0z"/>
              <path
                  android:fillColor="#FFC107"
                  android:pathData="M18,2H6c-1.1,0 -2,0.9 -2,2v16c0,1.1 0.9,2 2,2h12c1.1,0 2,-0.9 2,-2V4c0,-1.1 -0.9,-2 -2,-2zM6,4h5v8l-2.5,-1.5L6,12V4z"/>
          </vector>
          EOF
          
          # Set the launcher icon to our book vector
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@drawable\/ic_book_icon"/g' android/app/src/main/AndroidManifest.xml

          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-List-APK
          path: temp_app/book_list/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
