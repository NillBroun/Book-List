name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Android & Build APK
        run: |
          # 1. Android প্রজেক্ট কাঠামো তৈরি
          flutter create . --platforms=android --org com.ahm.booknotes

          # 2. সম্পূর্ণ সঠিক ও এররমুক্ত build.gradle.kts সরাসরি রাইট করা
          cat << 'EOF' > android/app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("kotlin-android")
              id("dev.flutter.flutter-gradle-plugin")
          }

          android {
              namespace = "com.ahm.booknotes.book_list"
              compileSdk = 34
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.ahm.booknotes.book_list"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }

          flutter {
              source = "../.."
          }
          EOF

          # 3. ব্যাকআপ সুবিধার জন্য Storage পারমিশন ও ডিসপ্লে নাম নিশ্চিত করা
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml

          # 4. ডিপেন্ডেন্সি লোড
          flutter pub get

          # 5. লঞ্চার আইকন তৈরি
          dart run flutter_launcher_icons

          # 6. ইউনিভার্সাল রিলিজ APK বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
