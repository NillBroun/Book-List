name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: 5. Fix SDK Directly in Gradle Files
        run: |
          cd ../booknotes_fresh

          # app লেভেলের build.gradle.kts এ সরাসরি মান বসানো
          python3 -c "
          import os

          path = 'android/app/build.gradle.kts'
          if os.path.exists(path):
              with open(path, 'r') as f:
                  text = f.read()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
              text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
              text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
              with open(path, 'w') as f:
                  f.write(text)
              print('Updated build.gradle.kts successfully')
          "

          # প্লাগইনগুলোর জন্য root settings.gradle.kts এ subprojects রুল যুক্ত করা
          python3 -c "
          import os

          # root build.gradle.kts এ সাব-প্রজেক্ট ওভাররাইড
          path = 'android/build.gradle.kts'
          if os.path.exists(path):
              with open(path, 'a') as f:
                  f.write('''
          subprojects {
              project.evaluationDependsOn(\":app\")
          }
          ''')
          "

          # পারমিশন ও অ্যাপের নাম
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Prepare Packages & Launcher Icons
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

      - name: 7. Compile Universal APK
        run: |
          cd ../booknotes_fresh
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
