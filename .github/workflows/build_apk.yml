name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: Configure Main App
        run: |
          cd ../booknotes_fresh

          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts

          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
          with open(p, 'w') as f:
              f.write(c)
          "

          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: Patch Dependencies to SDK 36
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

          python3 -c "
          import os

          cache_dir = os.path.expanduser('~/.pub-cache/hosted/pub.dev')
          for root, dirs, files in os.walk(cache_dir):
              for file in files:
                  if file == 'build.gradle':
                      fpath = os.path.join(root, file)
                      try:
                          with open(fpath, 'r', encoding='utf-8') as f:
                              content = f.read()
                          if 'android {' in content:
                              content = content.replace('android {', 'android {\n    compileSdkVersion 36', 1)
                              with open(fpath, 'w', encoding='utf-8') as f:
                                  f.write(content)
                              print(f'Patched: {fpath}')
                      except Exception:
                          pass
          "

          flutter build bundle

      - name: Compile Universal APK
        run: |
          cd ../booknotes_fresh/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

          cd ..
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp app/build/outputs/apk/release/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
