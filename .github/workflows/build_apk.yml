name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: 5. Force SDK 36 on All Subprojects & App
        run: |
          cd ../booknotes_fresh

          # ১. অ্যাপ লেভেলে minSdk 24, compileSdk 36 ও targetSdk 34 সেট করা
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts

          # ২. রিলিজ বিল্ডে ডিবাগ সাইনিং দেওয়া
          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('buildTypes {', 'buildTypes {\n        getByName(\"release\") {\n            signingConfig = signingConfigs.getByName(\"debug\")\n        }')
          with open(p, 'w') as f:
              f.write(c)
          "

          # ৩. রুট android/build.gradle.kts-এ file_picker সহ সব প্লাগইনের compileSdk强制 36 করা
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val androidExt = project.extensions.findByName("android")
                      if (androidExt != null) {
                          try {
                              val setCompileSdk = androidExt.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType)
                              setCompileSdk.invoke(androidExt, 36)
                          } catch (e: Exception) {
                              // ignore
                          }
                      }
                  }
              }
          }
          EOF

          # ৪. অতিরিক্ত সাপ্রেস ফ্ল্যাগ
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

          # ৫. অ্যাপের নাম BookNotes এবং অফলাইন স্টোরেজ পারমিশন
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Prepare Packages & Build Flutter Assets
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons
          flutter build bundle

      - name: 7. Compile Universal APK via Gradle
        run: |
          cd ../booknotes_fresh/android
          chmod +x gradlew
          # কোনো টাস্ক স্কিপ না করে স্বাভাবিক ফুল রিলিজ বিল্ড সম্পন্ন করা
          ./gradlew assembleRelease --no-daemon

          cd ..
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp app/build/outputs/apk/release/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
