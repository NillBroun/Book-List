name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: 5. Auto-Write All 3 Android Gradle Files
        run: |
          cd ../booknotes_fresh

          # ১. gradle-wrapper.properties স্বয়ংক্রিয়ভাবে বসানো
          cat << 'EOF' > android/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF

          # ২. android/build.gradle স্বয়ংক্রিয়ভাবে গ্রুভী ফরম্যাটে তৈরি করা
          rm -f android/build.gradle.kts
          cat << 'EOF' > android/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.buildDir = "../build"
          subprojects {
              project.buildDir = "${rootProject.buildDir}/${project.name}"
              project.evaluationDependsOn(":app")
              tasks.whenTaskAdded { task ->
                  if (task.name.contains("AarMetadata")) {
                      task.enabled = false
                  }
              }
          }
          tasks.register("clean", Delete) {
              delete rootProject.buildDir
          }
          EOF

          # ৩. android/app/build.gradle স্বয়ংক্রিয়ভাবে ঠিক করা
          rm -f android/app/build.gradle.kts
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }

          android {
              namespace = "com.ahm.booknotes"
              compileSdk = 36
              ndkVersion = flutter.ndkVersion

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17
              }

              defaultConfig {
                  applicationId = "com.ahm.booknotes"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = flutter.versionCode
                  versionName = flutter.versionName
              }

              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled = false
                      shrinkResources = false
                  }
              }
          }

          flutter {
              source = "../.."
          }

          tasks.whenTaskAdded { task ->
              if (task.name.contains("AarMetadata")) {
                  task.enabled = false
              }
          }
          EOF

          # অ্যাপের নাম BookNotes এবং স্টোরেজ পারমিশন
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Prepare Packages & Launcher Icons
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

      - name: 7. Compile Universal APK
        run: |
          cd ../booknotes_fresh
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons

          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
