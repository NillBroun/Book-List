name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup and Build App
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org=com.ahm book_list
          cd book_list
          cp ../../pubspec.yaml .
          cp ../../lib/main.dart ./lib/main.dart
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Book-List-APK
          path: temp_app/book_list/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
