name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Universal Release APK
        run: |
          # ১. অ্যান্ড্রয়েড কাঠামো তৈরি
          flutter create . --platforms=android --org com.ahm.booknotes

          # ২. সমস্ত প্লাগইনের জন্য গ্লোবালি minSdk 21 ও compileSdk 34 ফোর্স করা
          cat << 'EOF' >> android/app/build.gradle
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          defaultConfig {
                              minSdkVersion 21
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          EOF

          # ৩. অ্যাপের নাম ও পারমিশন নিশ্চিত করা
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # ৪. ডিপেন্ডেন্সি ও আইকন
          flutter pub get
          dart run flutter_launcher_icons

          # ৫. রিলিজ বিল্ড (no-shrink সহ যাতে প্লাগইন কনফ্লিক্ট না করে)
          flutter build apk --release --no-shrink --target-platform android-arm,android-arm64,android-x64

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
