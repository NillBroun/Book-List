name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform, Fix SDK & Build APK
        run: |
          # 1. Android কাঠামো তৈরি (পুরোনো main.dart অক্ষত রেখে)
          flutter create . --platforms=android --org com.ahm.booknotes

          # 2. Kotlin (.kts) অথবা Groovy (.gradle) উভয় ফাইলের জন্যই minSdk ও compileSdk ফিক্স
          python3 -c "
          import os

          # app লেভেল ফাইল চেক
          targets = ['android/app/build.gradle.kts', 'android/app/build.gradle']
          for p in targets:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      text = f.read()
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  text = text.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
                  text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
                  with open(p, 'w') as f:
                      f.write(text)
                  print(f'Successfully updated {p}')
          "

          # 3. ডিপেন্ডেন্সি লোড
          flutter pub get

          # 4. লঞ্চার আইকন তৈরি
          dart run flutter_launcher_icons

          # 5. অ্যাপের ডিসপ্লে নাম BookNotes নির্ধারণ
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml

          # 6. ইউনিভার্সাল রিলিজ APK বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
