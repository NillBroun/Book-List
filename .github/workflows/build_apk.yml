name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Build Universal APK
        run: |
          # ১. ফ্রেশ ও ক্লিন ফ্লুটার প্রজেক্ট তৈরি
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh

          # ২. আমাদের মূল ফাইলগুলো নতুন প্রজেক্টে কপি করা
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

          # ৩. গ্লোবালি অ্যান্ড্রয়েড SDK কনফিগারেশন সেট করা
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          echo "flutter.minSdkVersion=21" >> android/gradle.properties
          echo "flutter.compileSdkVersion=34" >> android/gradle.properties
          echo "flutter.targetSdkVersion=34" >> android/gradle.properties

          # ৪. ডিসপ্লে নাম ও পারমিশন নিশ্চিত করা
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # ৫. ডিপেন্ডেন্সি ও আইকন তৈরি
          flutter pub get
          dart run flutter_launcher_icons

          # ৬. রিলিজ কিস্টোরের ঝামেলা এড়িয়ে সফল ইউনিভার্সাল APK তৈরি করা
          # এটি সাইনিং সংক্রান্ত কোনো এরর ছাড়া সরাসরি ফোনে চলার মতো প্রস্তুত ইউনিভার্সাল APK তৈরি করে
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --no-tree-shake-icons

          # ৭. তৈরি হওয়া APK ফাইল মূল রিপোজিটরিতে স্থানান্তর
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
