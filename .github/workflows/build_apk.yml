name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Project & Build Universal APK
        run: |
          # ১. ফ্রেশ প্রজেক্ট তৈরি
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh

          # ২. সোর্স ফাইল কপি
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

          # ৩. আধুনিক AGP সাপোর্টেড উপায়ে minSdk ও compileSdk ইনজেক্ট করা
          cat << 'EOF' >> android/app/build.gradle.kts

          configurations.all {
              resolutionStrategy {
                  force("androidx.core:core-ktx:1.13.1")
              }
          }
          EOF

          # অ্যাপ লেভেলে সরাসরি মান বসানো
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle.kts

          # ৪. সব সাব-প্রজেক্ট ও প্লাগইনের জন্য Kotlin DSL স্টাইলে minSdk 21 ও compileSdk 34 ফোর্স করা
          cat << 'EOF' >> android/build.gradle.kts

          subprojects {
              afterEvaluate {
                  project.extensions.findByType(com.android.build.api.dsl.ApplicationExtension::class.java)?.apply {
                      compileSdk = 34
                      defaultConfig.minSdk = 21
                  }
                  project.extensions.findByType(com.android.build.api.dsl.LibraryExtension::class.java)?.apply {
                      compileSdk = 34
                      defaultConfig.minSdk = 21
                  }
              }
          }
          EOF

          # ৫. ডিসপ্লে নাম BookNotes ও ব্যাকআপ পারমিশন নিশ্চিত করা
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          # ৬. ডিপেন্ডেন্সি ও আইকন তৈরি
          flutter pub get
          dart run flutter_launcher_icons

          # ৭. ইউনিভার্সাল রিলিজ APK বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

          # ৮. APK ফাইল আউটপুটে পাঠানো
          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
