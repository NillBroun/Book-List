name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Platform, Fix SDK & Build APK
        run: |
          # 1. Android প্রজেক্ট কাঠামো তৈরি
          flutter create . --platforms=android --org com.ahm.booknotes

          # 2. সরাসরি Regex দিয়ে compileSdk, minSdk ও targetSdk ওভাররাইট
          python3 -c "
          import os, re

          targets = ['android/app/build.gradle.kts', 'android/app/build.gradle']
          for p in targets:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      c = f.read()
                  
                  # compileSdk -> 34
                  c = re.sub(r'compileSdk(Version)?\s*=?\s*.*', 'compileSdk = 34', c)
                  # minSdk -> 21
                  c = re.sub(r'minSdk(Version)?\s*=?\s*.*', 'minSdk = 21', c)
                  # targetSdk -> 34
                  c = re.sub(r'targetSdk(Version)?\s*=?\s*.*', 'targetSdk = 34', c)

                  with open(p, 'w') as f:
                      f.write(c)
                  print(f'Configured SDK in {p}')
          "

          # 3. ব্যাকআপ সুবিধার জন্য Storage পারমিশন ও নাম BookNotes নিশ্চিত করা
          python3 -c "
          p = 'android/app/src/main/AndroidManifest.xml'
          with open(p, 'r') as f:
              m = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />
          '''
          if 'READ_EXTERNAL_STORAGE' not in m:
              m = m.replace('<application', perms + '\n    <application')
          with open(p, 'w') as f:
              f.write(m)
          "
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml

          # 4. ডিপেন্ডেন্সি লোড
          flutter pub get

          # 5. লঞ্চার আইকন তৈরি
          dart run flutter_launcher_icons

          # 6. ইউনিভার্সাল রিলিজ APK বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
