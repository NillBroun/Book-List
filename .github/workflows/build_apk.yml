name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton, Fix Namespace, SDK & Build APK
        run: |
          # 1. Android প্রজেক্ট কাঠামো তৈরি
          flutter create . --platforms=android --org com.ahm.booknotes

          # 2. পাইথন দিয়ে build.gradle বা build.gradle.kts এ namespace, minSdk এবং compileSdk ঠিক করা
          python3 -c "
          import os

          files = ['android/app/build.gradle.kts', 'android/app/build.gradle']
          for p in files:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      text = f.read()
                  
                  # Namespace যোগ করা (না থাকলে)
                  if 'namespace' not in text:
                      text = text.replace('android {', 'android {\n    namespace \"com.ahm.booknotes.book_list\"')
                  
                  # SDK ভার্সন ফিক্স
                  text = text.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                  text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                  text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  text = text.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
                  text = text.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')

                  with open(p, 'w') as f:
                      f.write(text)
                  print(f'Configured successfully: {p}')
          "

          # 3. পাব ডিপেন্ডেন্সি গেট
          flutter pub get

          # 4. লঞ্চার আইকন জেনারেট
          dart run flutter_launcher_icons

          # 5. অ্যাপের ডিসপ্লে নাম সেট
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml

          # 6. ইউনিভার্সাল রিলিজ APK বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Universal Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
