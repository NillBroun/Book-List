name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Create Clean Android Workspace
        run: |
          cd ..
          flutter create -t app --org com.ahm booknotes_fresh
          cd booknotes_fresh
          cp -r ../Book-List/lib/* ./lib/
          cp ../Book-List/pubspec.yaml ./pubspec.yaml
          cp ../Book-List/app_icon2.png ./app_icon2.png

      - name: 5. Force SDK 21 and 34 on App Level
        run: |
          cd ../booknotes_fresh

          # app লেভেলের build.gradle.kts ফাইলে সরাসরি হার্ডকোড করা
          python3 -c "
          p = 'android/app/build.gradle.kts'
          with open(p, 'r') as f:
              c = f.read()
          c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
          c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
          c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
          with open(p, 'w') as f:
              f.write(c)
          "

          # অ্যাপের নাম BookNotes এবং অফলাইন স্টোরেজ পারমিশন
          sed -i 's/android:label=".*"/android:label="BookNotes"/g' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"\/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

      - name: 6. Prepare Packages & Launcher Icons
        run: |
          cd ../booknotes_fresh
          flutter pub get
          dart run flutter_launcher_icons

      - name: 7. Compile Universal APK
        run: |
          cd ../booknotes_fresh

          # পাব ক্যাশে থাকা সব প্লাগইনের build.gradle ফাইলে minSdk 21 ফোর্স করা (যাতে কোনো প্লাগইন আটকাতে না পারে)
          find /opt/hostedtoolcache/flutter -name "build.gradle" -exec sed -i 's/minSdkVersion 16/minSdkVersion 21/g' {} + 2>/dev/null || true
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/minSdkVersion 16/minSdkVersion 21/g' {} + 2>/dev/null || true

          # ইউনিভার্সাল রিলিজ বিল্ড
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

          mkdir -p ../Book-List/build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*.apk ../Book-List/build/app/outputs/flutter-apk/app-release.apk

      - name: 8. Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BookNotes-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
